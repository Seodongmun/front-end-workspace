<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Total Clicks : <span class="count">0</span></h1>
    <button onClick="setCount()">Click!</button>
    <button onClick="reset()">Reset</button>

    <script>
      let count = document.querySelector(".count");
      let num = 0;

      const setCount = () => {
        count.innerHTML = num++;
        console.log(count);
      };
      const reset = () => {
        count.innerHTML = 0;
      };
    </script>
  </body>
</html>
